# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS (MySQL)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskhero_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURACIÓN JPA / HIBERNATE
# ===================================================================
# 'update' crea las tablas automáticamente al iniciar según las entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ===================================================================
server.port=${PORT:8080}
spring.application.name=taskhero-backend

# Perfil "local" activo por defecto: carga application-local.properties (gitignoreado,
# con los secretos reales para desarrollo). En Railway/producción ese archivo no existe,
# asi que activar "local" ahi no hace nada (Spring simplemente no encuentra el archivo) y
# los secretos reales llegan como variables de entorno propias del servicio.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===================================================================
# SEGURIDAD Y JWT (Base para el siguiente paso)
# ===================================================================
# Tiempo de expiración: 1 día (en milisegundos)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Clave de cifrado para datos sensibles en DB (Mensajes)
app.db.encryption-key=${DB_ENCRYPTION_KEY}

# ===================================================================
# CONFIGURACIÓN DE EMAIL (SMTP)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

